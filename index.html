<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Samle eggbestillingen til frokosten: kokt eller stekt, til hvem, og når de skal i kjelen."
    />
    <meta name="theme-color" content="#eaf3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151d2e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Egg o'clock" />
    <script>
      // Apply a saved theme before first paint so it never flashes the system theme.
      // Keep the key and colours in sync with src/hooks/useTheme.ts.
      try {
        var theme = localStorage.getItem("egg-oclock:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          var bar = theme === "dark" ? "#151d2e" : "#eaf3fb";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = bar;
          });
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Egg o'clock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
